# Xunji runtime mode example
# Copy to config.ini for local overrides. Real config.ini is ignored by git.

[mode]
# normal = run_gate may block repeated drift; Normal-only review/completion prerequisites apply
# dev    = output_gate still records/reminds; hard safety/evidence/Coda/closure-integrity gates stay hard
mode = normal

# External/third-party review assistance is local opt-in because enabling it can
# send a redacted frozen review bundle to another provider. `providers` contains
# trusted registry names, not shell commands. Add provider definitions in
# tools/peer_review.py or review/peer_review.json, then enable their names here.
[external_assistance]
enabled = false
providers = arkcli
