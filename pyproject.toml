[project]
name = "Xunji"
version = "0.1.0"
description = "Claude Code autonomous red-team web initial-access workspace with deterministic safety boundaries."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff==0.12.7",
    "mypy==1.17.1",
]
browser = [
    "playwright>=1.40",
]
socks = [
    "PySocks>=1.7",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
