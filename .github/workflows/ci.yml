name: deterministic-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-full:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python tools/check_rules.py
      - run: python tools/check_templates.py
      - run: python tools/check_runtime_boundary.py
      - run: python tools/check_local_hygiene.py
      - run: python .agents/skills/xunji-closure-audit/scripts/closure_audit.py
      - run: python tools/context_budget.py
      - run: python tools/bench.py --selftest
      - run: python tools/selftest_all.py
      - run: ruff check tools/stage_policy.py tools/canonical_records.py tools/context_budget.py tools/peer_review.py tools/inspect_artifact.py tools/websocket_probe.py tools/clean_scratch.py tools/preflight.py
      - run: mypy tools/stage_policy.py tools/inspect_artifact.py tools/clean_scratch.py
      - run: mypy --follow-imports=skip tools/canonical_records.py tools/context_budget.py tools/peer_review.py tools/preflight.py tools/websocket_probe.py
      - if: github.event_name == 'pull_request'
        run: python tools/preflight.py --base-ref "${{ github.event.pull_request.base.sha }}"
      - if: github.event_name == 'push'
        shell: bash
        run: |
          preflight_base="${{ github.event.before }}"
          if [[ "$preflight_base" =~ ^0+$ ]]; then
            preflight_base="$(git hash-object -t tree /dev/null)"
          fi
          python tools/preflight.py --base-ref "$preflight_base"

  portable-focused:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/check_rules.py
      - run: python tools/check_templates.py
      - run: python tools/selftest_all.py --only command_shape,setup_transaction,turn_contract,proxy,guard_smoke,stage_policy,inspect_artifact,clean_scratch

  bench-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/bench.py score-all bench --json-out bench-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-json
          path: bench-results.json
          if-no-files-found: ignore
